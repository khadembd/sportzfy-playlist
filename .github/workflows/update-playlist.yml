name: Update Sportzfy Playlist

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/update-playlist.yml'

permissions:
  contents: write

concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run playlist updater
        run: |
          python scripts/sportzfy_auto_update.py

      - name: Show generated files
        run: |
          echo "=== Generated files ==="
          ls -lah output/
          echo ""
          echo "=== status.json ==="
          cat output/status.json

      - name: Commit & push updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore: auto-update Sportzfy playlist — ${TIMESTAMP}"
            git push
            echo "✓ Pushed updated playlist"
          fi

      - name: Cleanup old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo,
              workflow_id: 'update-playlist.yml',
              per_page: 100
            });
            const oldRuns = runs.data.workflow_runs
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(30);
            for (const run of oldRuns) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
              } catch (e) {}
            }
